name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download NLTK data
      run: |
        python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"

    - name: Run tests
      run: pytest test_app.py -v
      continue-on-error: true

  deploy-vercel:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-vercel
      url: https://${{ secrets.VERCEL_DOMAIN }}
    steps:
    - uses: actions/checkout@v4

    - name: Deploy Frontend to Vercel
      uses: vercel/action@main
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
      if: secrets.VERCEL_TOKEN != ''

  deploy-render:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-render
      url: https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com
    steps:
    - uses: actions/checkout@v4

    - name: Deploy Backend to Render
      run: |
        curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
      if: secrets.RENDER_API_KEY != ''

    - name: Deployment Status
      run: |
        echo "🚀 Backend deployment triggered on Render"
        echo "Service: ${{ secrets.RENDER_SERVICE_NAME }}"
        echo "Frontend: ${{ secrets.VERCEL_DOMAIN }}"

  notify:
    needs: [test, deploy-vercel, deploy-render]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Deployment Summary
      run: |
        echo "✅ CI/CD Pipeline Completed"
        echo "Backend Tests: ${{ needs.test.result }}"
        echo "Vercel (Frontend): ${{ needs.deploy-vercel.result }}"
        echo "Render (Backend): ${{ needs.deploy-render.result }}"
