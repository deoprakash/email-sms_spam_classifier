name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Deployment platform'
        required: true
        default: 'heroku'
        type: choice
        options:
          - heroku
          - railway
          - render

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download NLTK data
      run: |
        python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"

    - name: Run tests
      run: pytest test_app.py -v
      continue-on-error: true

  deploy-heroku:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-heroku
      url: https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Deploy to Heroku
      uses: akhileshns/heroku-deploy@v3.12.14
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        buildpack: "heroku/python"
        procfile: "Procfile"
      if: secrets.HEROKU_API_KEY != ''

  deploy-railway:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-railway
      url: https://${{ secrets.RAILWAY_APP_NAME }}.railway.app
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Railway
      uses: railwayapp/deploy-action@v1
      with:
        token: ${{ secrets.RAILWAY_TOKEN }}
        service: ${{ secrets.RAILWAY_SERVICE_NAME }}
      if: secrets.RAILWAY_TOKEN != ''

  deploy-render:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production-render
      url: https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Render
      run: |
        curl https://api.render.com/deploy/${{ secrets.RENDER_DEPLOY_HOOK }}?gitCommitSha=${{ github.sha }}
      if: secrets.RENDER_DEPLOY_HOOK != ''

    - name: Check deployment status
      run: |
        echo "🚀 Deployment triggered to Render"
        echo "Service: ${{ secrets.RENDER_SERVICE_NAME }}"

  notify:
    needs: [test, deploy-heroku, deploy-railway, deploy-render]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Deployment Summary
      run: |
        echo "✅ CI/CD Pipeline Completed"
        echo "Test Status: ${{ needs.test.result }}"
